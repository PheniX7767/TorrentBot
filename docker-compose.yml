services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # Must be True — without --local uploads are capped ~50MB and file:// is rejected
      TELEGRAM_LOCAL: "True"
    volumes:
      - ${DATA_DIR:-/var/lib/torrent-bot}/bot-api:/var/lib/telegram-bot-api
      - ${DATA_DIR:-/var/lib/torrent-bot}/downloads:/downloads

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
    volumes:
      - ${DATA_DIR:-/var/lib/torrent-bot}/qbit-config:/config
      - ${DATA_DIR:-/var/lib/torrent-bot}/downloads:/downloads
    ports:
      - "127.0.0.1:8080:8080"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
      - qbittorrent
    env_file:
      - .env
    environment:
      BOT_API_BASE_URL: http://telegram-bot-api:8081
      QBITTORRENT_URL: http://qbittorrent:8080
      DOWNLOADS_DIR: /downloads
      TELEGRAM_LOCAL: "True"
    volumes:
      - ${DATA_DIR:-/var/lib/torrent-bot}/downloads:/downloads
      - ${DATA_DIR:-/var/lib/torrent-bot}/cookies:/cookies:ro
